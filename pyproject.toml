[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[project]
name = "campusguide-sufe-fastapi"
version = "0.1.0"
description = "Readable FastAPI backend for an evidence-grounded campus Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
mysql = [
  "aiomysql>=0.2,<1.0",
  # MySQL 8 uses caching_sha2_password by default. PyMySQL/aiomysql needs
  # cryptography when the connection performs the RSA password exchange.
  "cryptography>=42,<47",
]
redis = [
  "redis>=5.0,<8.0",
]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's documented dependency-injection pattern intentionally calls
# Depends() in a parameter default; tell Ruff that this call is immutable.
extend-immutable-calls = ["fastapi.Depends"]
