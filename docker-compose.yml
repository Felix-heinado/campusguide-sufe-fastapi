services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local_root_password
      MYSQL_DATABASE: campusguide_fastapi
      MYSQL_USER: campusguide_app
      MYSQL_PASSWORD: local_app_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/schema.mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal_root_password"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      PERSISTENCE_BACKEND: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: campusguide_app
      MYSQL_PASSWORD: local_app_password
      MYSQL_DATABASE: campusguide_fastapi
      AGENT_MODEL_PROVIDER: deterministic
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:

